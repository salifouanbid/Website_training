<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Profile</h1>
    <img src="photo.jpg" alt="Photo de profile de Anbid" width="150" height="150" class="Profile-picture">
    <p>Name: John Doe</p>
    <p>Biography: I am a software developer with experience in Python and web development.</p>

    <section>
        <ul class="stats-list">
            <li>
                <label for="followers">Followers:</label>
                <input type="number" id="followers" min="0" max="100000" required>
            </li>
            <li>
                <label for="following">Following:</label>
                <input type="number" id="following" min="0" max="100000" required>
            </li>
            <li>
                <label for="posts">Posts:</label>
                <input type="number" id="posts" min="0" max="100000" required>
            </li>
        </ul>
    </section>
</body>
</html>
